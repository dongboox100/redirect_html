<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home</title>
</head>
<body>
    <script>
        (function() {
            // Cek parameter v di URL
            const urlParams = new URLSearchParams(window.location.search);
            const encodedUrl = urlParams.get('v');

            if (encodedUrl) {
                // Jika ada parameter v, redirect langsung ke URL tujuan
                const targetUrl = decodeURIComponent(encodedUrl);
                window.location.href = targetUrl;
            } else {
                // Jika tidak ada parameter v, redirect ke home.html
                window.location.href = 'home.html';
            }
        })();
    </script>
</body>
</html>
